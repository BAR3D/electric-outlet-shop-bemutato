<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Electric Outlet Shop – logóanimáció</title>
<style>
  :root { --bg: #07080a; --yel: #ffc21a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; }
  /* a színpad mindig 16:9, a nappali képe pontosan kitölti – a képernyő helye % -ban ugyanaz minden méretnél */
  .stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: #000 url("nappali.jpg") center / 100% 100% no-repeat; overflow: hidden; }
  /* a TV fénye a falon és a környezetben: a képernyő fényességét követi (JS állítja az --l értéket) */
  .glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: var(--l, 0);
    background: radial-gradient(ellipse 30% 34% at 50% 45%, rgba(255, 205, 90, .62), rgba(255, 190, 60, .22) 55%, transparent 85%),
                radial-gradient(ellipse 40% 30% at 50% 36%, rgba(255, 200, 80, .5), transparent 80%),
                radial-gradient(ellipse 34% 16% at 50% 68%, rgba(255, 190, 60, .30), transparent 85%); }
  .dim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 80% at 50% 40%, transparent 40%, rgba(0, 0, 0, .55)); }
  /* a képernyő pontos helye a képen: x 491–1043, y 236–552 a 1536×864-es képen */
  .screen { box-shadow: 0 0 calc(var(--l, 0) * 70px) calc(var(--l, 0) * 12px) rgba(255, 205, 90, calc(var(--l, 0) * .5)); position: absolute; left: 31.97%; top: 27.31%; width: 35.94%; height: 36.57%; overflow: hidden; background: #020203; }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, .03) 28%, transparent 42%), repeating-linear-gradient(0deg, rgba(0, 0, 0, .13) 0 1px, transparent 1px 3px); }
  .cim { position: absolute; left: 0; right: 0; bottom: 2.2%; text-align: center; color: rgba(255, 255, 255, .55); font-size: clamp(10px, 1.1vw, 14px); letter-spacing: .28em; text-transform: uppercase; }
  .embed .cim { display: none; }
  @media (max-aspect-ratio: 4/5) { body { display: block; } .stage { position: absolute; width: 235vw; left: 50%; top: 50%; transform: translate(-50%, -45.5%); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow" id="glow"></div>
  <div class="screen" id="screen"><canvas id="cv"></canvas></div>
  <div class="dim"></div>
  <div class="cim">Electric Outlet Shop</div>
</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), glow = document.getElementById('glow'), stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const Q = new URLSearchParams(location.search), TVLOGO = Q.get('logo') === 'tv', EMBED = Q.has('embed');
  if (EMBED) document.documentElement.classList.add('embed');
  const logo = new Image(); logo.src = TVLOGO ? 'logo-tv.svg' : 'logo-sotet-hatterre.svg';
  let W = 0, H = 0, dpr = 1, P = [], logoBox = null, t0 = 0, paused = false, off0 = 0;
  const CYCLE = 12.0, T_ON = 0.9, T_ASM = 4.6, T_HOLD = 9.0, T_END = 10.6;   // másodpercek: bekapcsolás · összeállás · kész logó · szétesés · szünet
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3), easeIn = (x) => x * x * x, easeIO = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    sample();
  }

  // a logó képpontjainak mintavétele: minden minta egy részecske, ami a helyére repül
  function sample() {
    if (!logo.complete || !W) return;
    const lw = W * (TVLOGO ? 0.78 : 0.86), lh = lw * (logo.naturalHeight / logo.naturalWidth);
    logoBox = { x: (W - lw) / 2, y: (H - lh) / 2, w: lw, h: lh };
    const off = document.createElement('canvas'); off.width = Math.round(W); off.height = Math.round(H);
    const o = off.getContext('2d', { willReadFrequently: true });
    o.drawImage(logo, logoBox.x, logoBox.y, logoBox.w, logoBox.h);
    const d = o.getImageData(0, 0, off.width, off.height).data;
    const step = Math.max(2, Math.round(W / 230)), pts = [];
    for (let y = 0; y < off.height; y += step) for (let x = 0; x < off.width; x += step) {
      const i = (y * off.width + x) * 4; if (d[i + 3] < 140) continue;
      pts.push({ x: x + step / 2, y: y + step / 2, c: [d[i], d[i + 1], d[i + 2]] });
    }
    P = pts.map((p) => {
      const ang = Math.random() * Math.PI * 2, far = rnd(.15, .75) * Math.max(W, H);
      return { tx: p.x, ty: p.y, c: p.c, s: step,
        sx: clamp(W / 2 + Math.cos(ang) * far, -20, W + 20), sy: clamp(H / 2 + Math.sin(ang) * far * .6, -20, H + 20),   // honnan érkezik
        ex: p.x + rnd(-1, 1) * W * .5, ey: p.y + rnd(.2, 1) * H * .9,                                             // hova esik szét
        da: (p.x / W) * 0.55 + Math.random() * 0.35, de: Math.random() * .8, ph: Math.random() * 6.28 };
    });
  }

  function frame(now) {
    if (paused) { off0 = now; return; }
    if (!t0) t0 = now;
    if (off0) { t0 += now - off0; off0 = 0; }
    const t = reduce ? T_HOLD - 1 : ((now - t0) / 1000) % CYCLE;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#020203'; ctx.fillRect(0, 0, W, H);
    let lum = 0;   // a képernyő fényessége (0–1) – a szoba fényét ez adja

    if (t < T_ON) {   // bekapcsolás: vékony fénycsík nyílik képernyőnyire
      const k = easeOut(t / T_ON), w = W * clamp(k * 1.6), h = Math.max(1.5, H * clamp((k - .35) / .65) * .02 + 2);
      const g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(W / 2 - w / 2, H / 2 - h / 2, w, h); lum = .08 * k;
    } else if (t < T_END) {
      const ta = t - T_ON, asm = clamp(ta / (T_ASM - T_ON)), hold = clamp((t - T_ASM) / 1.3), out = clamp((t - T_HOLD) / (T_END - T_HOLD));
      // finom hátter-izzás a képernyőn
      const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .6); bg.addColorStop(0, `rgba(255,194,26,${.10 * (1 - out)})`); bg.addColorStop(1, 'rgba(255,194,26,0)');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      // részecskék
      let lit = 0;
      for (const p of P) {
        let x, y, a, sz = p.s * .92;
        if (out > 0) {   // szétesés
          const k = easeIn(clamp((out - p.de * .5) / (1 - p.de * .5))); x = p.tx + (p.ex - p.tx) * k; y = p.ty + (p.ey - p.ty) * k; a = 1 - k;
        } else {         // összeállás: hullámszerűen balról jobbra, finom remegéssel
          const k = easeOut(clamp((asm - p.da * .55) / .45)); const w = (1 - k) * 6;
          x = p.sx + (p.tx - p.sx) * k + Math.sin(now / 160 + p.ph) * w; y = p.sy + (p.ty - p.sy) * k + Math.cos(now / 190 + p.ph) * w; a = clamp(k * 1.6 + .15) * (0.75 + .25 * Math.sin(now / 90 + p.ph));
          lit += k;
        }
        const whiteness = out > 0 ? 0 : (1 - easeOut(clamp((asm - p.da * .55) / .45))) * .7;   // repülés közben fehéren izzik, a helyére érve felveszi a színét
        const r = Math.round(p.c[0] + (255 - p.c[0]) * whiteness), gC = Math.round(p.c[1] + (255 - p.c[1]) * whiteness), b = Math.round(p.c[2] + (255 - p.c[2]) * whiteness);
        ctx.fillStyle = `rgba(${r},${gC},${b},${clamp(a)})`; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
      }
      // kész logó: éles vektoros kép úszik át a pontokról, rajta átfutó fénycsík
      if (hold > 0 && out < 1) {
        ctx.globalAlpha = easeIO(hold) * (1 - out); ctx.drawImage(logo, logoBox.x, logoBox.y, logoBox.w, logoBox.h);
        const sw = ((t - T_ASM) / (T_HOLD - T_ASM)) * 1.6 - .3, gx = W * sw;
        ctx.save(); ctx.beginPath(); ctx.rect(logoBox.x, logoBox.y, logoBox.w, logoBox.h); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
        const sg = ctx.createLinearGradient(gx - 60, 0, gx + 60, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.28)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sg; ctx.drawImage(logo, logoBox.x, logoBox.y, logoBox.w, logoBox.h); ctx.globalCompositeOperation = 'source-atop'; ctx.fillRect(gx - 60, 0, 120, H); ctx.restore(); ctx.globalAlpha = 1;
      }
      lum = (.22 + .78 * clamp(lit / Math.max(1, P.length) * 1.2)) * (1 - out) * (.94 + .06 * Math.sin(now / 700));
      if (hold > 0) lum = (.92 + .08 * Math.sin(now / 600)) * (1 - out) + 0.0;
    }
    stage.style.setProperty('--l', (lum * 1.15).toFixed(3));
    requestAnimationFrame(frame);
  }

  addEventListener('message', (e) => { if (e.data === 'pause') paused = true; else if (e.data === 'play' && paused) { paused = false; requestAnimationFrame(frame); } });
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(size, 150); });
  const go = () => { size(); requestAnimationFrame(frame); };
  logo.complete ? go() : logo.addEventListener('load', go);
})();
</script>
</body>
</html>
